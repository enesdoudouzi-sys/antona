<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#0a2744"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="80" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="680" cy="30" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="740" cy="90" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="30" cy="200" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="770" cy="300" r="1.5" fill="#fff" opacity="0.5"/>

  <!-- Header -->
  <text x="400" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFD700">🌟 Lernsterne</text>
  <text x="400" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">KI-Lernapp für Grundschulkinder</text>

  <!-- Topic buttons row 1 -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="100" height="32" rx="8" fill="#3b82f6" opacity="0.9"/>
    <text x="50" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">➕ Plus</text>

    <rect x="110" y="0" width="100" height="32" rx="8" fill="#1e3a5f"/>
    <text x="160" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">➖ Minus</text>

    <rect x="220" y="0" width="120" height="32" rx="8" fill="#1e3a5f"/>
    <text x="280" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">✖️ Einmaleins</text>

    <rect x="350" y="0" width="100" height="32" rx="8" fill="#1e3a5f"/>
    <text x="400" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">➗ Division</text>

    <rect x="460" y="0" width="120" height="32" rx="8" fill="#1e3a5f"/>
    <text x="520" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">📖 Sachaufg.</text>

    <rect x="590" y="0" width="110" height="32" rx="8" fill="#1e3a5f"/>
    <text x="645" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">📐 Geometrie</text>
  </g>

  <!-- Topic buttons row 2 -->
  <g transform="translate(50, 132)">
    <rect x="0" y="0" width="100" height="32" rx="8" fill="#1e3a5f"/>
    <text x="50" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">🍕 Brüche</text>

    <rect x="110" y="0" width="140" height="32" rx="8" fill="#1e3a5f"/>
    <text x="180" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">⚖️ Größen</text>

    <rect x="260" y="0" width="130" height="32" rx="8" fill="#1e3a5f"/>
    <text x="325" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">📏 Zahlenstrahl</text>

    <rect x="400" y="0" width="130" height="32" rx="8" fill="#1e3a5f"/>
    <text x="465" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">🔢 Muster</text>
  </g>

  <!-- Difficulty -->
  <g transform="translate(50, 185)">
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Schwierigkeit:</text>
    <rect x="100" y="0" width="70" height="24" rx="6" fill="#10b981" opacity="0.9"/>
    <text x="135" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold">Leicht</text>
    <rect x="180" y="0" width="70" height="24" rx="6" fill="#1e3a5f"/>
    <text x="215" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Mittel</text>
    <rect x="260" y="0" width="70" height="24" rx="6" fill="#1e3a5f"/>
    <text x="295" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Schwer</text>
  </g>

  <!-- Task card -->
  <rect x="50" y="225" width="700" height="130" rx="16" fill="url(#card)" filter="url(#shadow)"/>
  <rect x="50" y="225" width="700" height="130" rx="16" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>

  <text x="400" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0">Mia hat 24 Murmeln und bekommt 13 dazu.</text>
  <text x="400" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0">Wie viele hat sie jetzt?</text>

  <!-- Answer buttons -->
  <g transform="translate(80, 302)">
    <rect x="0" y="0" width="140" height="38" rx="10" fill="#10b981"/>
    <text x="70" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#fff" font-weight="bold">37</text>

    <rect x="160" y="0" width="140" height="38" rx="10" fill="#1e3a5f"/>
    <text x="230" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">36</text>

    <rect x="320" y="0" width="140" height="38" rx="10" fill="#1e3a5f"/>
    <text x="390" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">47</text>

    <rect x="480" y="0" width="140" height="38" rx="10" fill="#1e3a5f"/>
    <text x="550" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">27</text>
  </g>

  <!-- Feedback -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#FFD700" font-weight="bold">🌟 Fantastisch! Du bist ein Mathe-Profi!</text>

  <!-- Score -->
  <rect x="660" y="225" width="90" height="40" rx="10" fill="#f59e0b" opacity="0.15"/>
  <text x="705" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b">Punkte</text>
  <text x="705" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#f59e0b" font-weight="bold">130</text>

  <!-- Bottom badges -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="120" height="28" rx="6" fill="#1e3a5f"/>
    <text x="60" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa">⚡ KI-generiert</text>

    <rect x="130" y="0" width="140" height="28" rx="6" fill="#1e3a5f"/>
    <text x="200" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa">🧠 Adaptiv</text>

    <rect x="280" y="0" width="140" height="28" rx="6" fill="#1e3a5f"/>
    <text x="350" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa">🔄 Spaced Rep.</text>

    <rect x="430" y="0" width="140" height="28" rx="6" fill="#1e3a5f"/>
    <text x="500" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa">📱 PWA</text>

    <rect x="580" y="0" width="140" height="28" rx="6" fill="#1e3a5f"/>
    <text x="650" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa">🇩🇪 Klasse 1–4</text>
  </g>
</svg>
