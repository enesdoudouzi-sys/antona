<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Lernsterne</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: Vollbild-Kinder-App — Start-Raster mit 4 großen Fächer-Kacheln, dann Vollbild-Aufgabe mit großem Antwort-Raster. */
  :root{
    --bg:#fff7ec;         /* warmes Creme */
    --panel:#ffffff;
    --ink:#3a2f28;        /* weiches Dunkelbraun statt Schwarz */
    --ink-soft:#8a7a6d;
    --line:#f0e3d2;
    --accent:#ff8a3d;     /* Mandarine */
    --accent-ink:#8a3b00;
    --math:#ff6b6b;       /* Mathe rot */
    --read:#4e9bff;       /* Lesen blau */
    --shape:#38c2a0;      /* Formen grün */
    --clock:#b07bff;      /* Uhr lila */
    --good:#36b37e;
    --star:#ffc53d;
    --shadow:0 .5rem 0 rgba(0,0,0,.08);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#211b16;--panel:#2e2620;--ink:#f6ece0;--ink-soft:#c3b09e;--line:#3d342c;
      --accent:#ff9a56;--accent-ink:#ffd9bd;
      --math:#ff7a7a;--read:#6aacff;--shape:#49d2b0;--clock:#c295ff;
      --good:#4cc994;--star:#ffd45e;--shadow:0 .5rem 0 rgba(0,0,0,.35);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#211b16;--panel:#2e2620;--ink:#f6ece0;--ink-soft:#c3b09e;--line:#3d342c;
    --accent:#ff9a56;--accent-ink:#ffd9bd;
    --math:#ff7a7a;--read:#6aacff;--shape:#49d2b0;--clock:#c295ff;
    --good:#4cc994;--star:#ffd45e;--shadow:0 .5rem 0 rgba(0,0,0,.35);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
    font-weight:700;
    display:flex;flex-direction:column;
    min-height:100%;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,.display{font-family:"Baloo 2","Nunito",ui-rounded,system-ui,sans-serif;font-weight:800}

  .wrap{
    width:100%;max-width:46rem;margin:0 auto;flex:1;display:flex;flex-direction:column;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:1rem 1.4rem;
  }

  /* Kopfzeile */
  .top{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
  .brand{display:flex;align-items:center;gap:.5rem;font-family:"Baloo 2",sans-serif;font-size:1.5rem;font-weight:800}
  .brand .logo{font-size:1.6rem;line-height:1}
  .spacer{flex:1}
  .starbox{
    display:flex;align-items:center;gap:.35rem;background:var(--panel);
    border:.18rem solid var(--line);border-radius:999px;padding:.35rem .8rem;
    font-size:1.15rem;color:var(--accent-ink);box-shadow:var(--shadow)
  }
  .starbox .s{color:var(--star);font-size:1.2rem}
  .iconbtn{
    border:.18rem solid var(--line);background:var(--panel);color:var(--ink);
    width:2.9rem;height:2.9rem;border-radius:1rem;font-size:1.3rem;cursor:pointer;
    box-shadow:var(--shadow);display:grid;place-items:center;flex:none
  }
  .iconbtn:active{transform:translateY(.2rem);box-shadow:none}

  /* Start */
  .hello{font-size:1.5rem;margin:.2rem 0 1rem;text-wrap:balance}
  .hello small{display:block;font-size:1rem;color:var(--ink-soft);font-weight:700;margin-top:.2rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .tile{
    border:none;border-radius:1.6rem;padding:1.3rem 1.1rem;cursor:pointer;color:#fff;
    text-align:left;box-shadow:var(--shadow);position:relative;overflow:hidden;
    display:flex;flex-direction:column;gap:.3rem;min-height:9.5rem;
    font-family:"Baloo 2",sans-serif;transition:transform .08s
  }
  .tile:active{transform:translateY(.25rem) scale(.99)}
  .tile .emoji{font-size:2.8rem;line-height:1}
  .tile .name{font-size:1.45rem;font-weight:800}
  .tile .sub{font-size:.95rem;font-weight:600;opacity:.92;font-family:"Nunito",sans-serif}
  .tile.m{background:linear-gradient(160deg,#ff8f8f,var(--math))}
  .tile.r{background:linear-gradient(160deg,#7fb6ff,var(--read))}
  .tile.s{background:linear-gradient(160deg,#5fd9bd,var(--shape))}
  .tile.c{background:linear-gradient(160deg,#c9a4ff,var(--clock))}
  .tile .mini{position:absolute;right:.7rem;bottom:.6rem;background:rgba(255,255,255,.25);
    border-radius:999px;padding:.15rem .6rem;font-size:.8rem;font-family:"Nunito",sans-serif;font-weight:800}

  /* Aufgaben-Ansicht */
  .play{flex:1;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
  .back{border:.18rem solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:1rem;padding:.5rem .9rem;font-size:1rem;cursor:pointer;box-shadow:var(--shadow);font-weight:800;font-family:"Nunito",sans-serif}
  .back:active{transform:translateY(.2rem);box-shadow:none}
  .progress{flex:1;height:.9rem;background:var(--line);border-radius:999px;overflow:hidden}
  .progress>i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .3s}
  .round{font-size:1rem;color:var(--ink-soft);font-weight:800;font-family:"Nunito",sans-serif}

  .card{
    background:var(--panel);border:.2rem solid var(--line);border-radius:1.6rem;
    padding:1.4rem 1.1rem;box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1.1rem;text-align:center
  }
  .qlabel{font-size:1.05rem;color:var(--ink-soft);font-weight:800;display:flex;align-items:center;gap:.5rem}
  .read-btn{border:none;background:var(--accent);color:#fff;border-radius:999px;width:2.4rem;height:2.4rem;
    font-size:1.1rem;cursor:pointer;display:grid;place-items:center;box-shadow:0 .25rem 0 rgba(0,0,0,.12)}
  .read-btn:active{transform:translateY(.15rem);box-shadow:none}
  .question{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:3.2rem;line-height:1.05;text-wrap:balance}
  .question .em{font-size:4.2rem;display:block}
  svg.art{width:min(16rem,70vw);height:auto;max-width:100%}

  .answers{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;width:100%;max-width:30rem}
  .answers.three{grid-template-columns:1fr 1fr 1fr}
  .opt{
    border:.22rem solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:1.3rem;padding:1.1rem .6rem;font-size:2rem;cursor:pointer;
    font-family:"Baloo 2",sans-serif;font-weight:800;box-shadow:var(--shadow);
    transition:transform .08s;min-height:4.4rem;display:grid;place-items:center
  }
  .opt .word{font-size:1.4rem}
  .opt:active{transform:translateY(.2rem);box-shadow:none}
  .opt.good{background:var(--good);color:#fff;border-color:transparent;animation:pop .35s}
  .opt.bad{background:#ffe0e0;border-color:#ff9a9a;color:#b33;animation:shake .35s}
  :root[data-theme="dark"] .opt.bad,:root:not([data-theme="light"]) .opt.bad{background:#4a2d2d}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.bad{background:#4a2d2d}}
  .opt[disabled]{cursor:default;opacity:.55}
  .opt.good[disabled],.opt.bad[disabled]{opacity:1}

  .feedback{min-height:2rem;font-size:1.3rem;font-weight:800;font-family:"Baloo 2",sans-serif;display:flex;align-items:center;gap:.4rem}
  .feedback.ok{color:var(--good)}
  .feedback.try{color:var(--accent-ink)}

  .next{border:none;background:var(--accent);color:#fff;border-radius:1.2rem;padding:.9rem 1.8rem;
    font-size:1.25rem;font-weight:800;font-family:"Baloo 2",sans-serif;cursor:pointer;box-shadow:0 .35rem 0 rgba(0,0,0,.15)}
  .next:active{transform:translateY(.2rem);box-shadow:none}

  /* Belohnungs-Bildschirm */
  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center}
  .done .big{font-size:4.5rem;animation:pop .5s}
  .done h2{font-size:2rem;margin:0}
  .done p{color:var(--ink-soft);font-size:1.1rem;margin:0}
  .gotstars{display:flex;gap:.3rem;font-size:2rem;color:var(--star)}

  .foot{text-align:center;color:var(--ink-soft);font-size:.85rem;font-weight:700;margin-top:1rem;font-family:"Nunito",sans-serif}

  @keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
  @keyframes floatstar{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-7rem) scale(1.3);opacity:0}}
  .flystar{position:fixed;font-size:2.6rem;color:var(--star);pointer-events:none;z-index:50;animation:floatstar 1s ease-out forwards}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important}}
  :focus-visible{outline:.2rem solid var(--accent);outline-offset:.2rem}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo">⭐</span><span>Lernsterne</span></div>
    <div class="spacer"></div>
    <div class="starbox"><span class="s">★</span><span id="starCount">0</span></div>
    <button class="iconbtn" id="themeBtn" title="Hell/Dunkel" aria-label="Hell oder Dunkel">🌙</button>
  </div>

  <!-- START -->
  <div id="home">
    <div class="hello">Hallo! Was möchtest du üben?<small>Für Kinder in der 1. und 2. Klasse</small></div>
    <div class="grid">
      <button class="tile m" data-game="math">
        <span class="emoji">🔢</span><span class="name">Rechnen</span>
        <span class="sub">Mengen, Zehnerfeld, Plus & Minus</span><span class="mini" id="best-math">★ 0</span>
      </button>
      <button class="tile r" data-game="read">
        <span class="emoji">🔤</span><span class="name">Lesen</span>
        <span class="sub">Anlaute & Wörter</span><span class="mini" id="best-read">★ 0</span>
      </button>
      <button class="tile s" data-game="shape">
        <span class="emoji">🔺</span><span class="name">Formen & Farben</span>
        <span class="sub">Erkennen & benennen</span><span class="mini" id="best-shape">★ 0</span>
      </button>
      <button class="tile c" data-game="clock">
        <span class="emoji">🕐</span><span class="name">Die Uhr</span>
        <span class="sub">Uhrzeit lesen</span><span class="mini" id="best-clock">★ 0</span>
      </button>
    </div>
    <div class="foot">Tipp: Mit dem 🔊-Knopf wird die Aufgabe vorgelesen.</div>
  </div>

  <!-- SPIEL -->
  <div id="play" class="play" hidden>
    <div class="bar">
      <button class="back" id="backBtn">← Zurück</button>
      <div class="progress"><i id="progBar"></i></div>
      <div class="round" id="roundLbl">1/10</div>
    </div>
    <div class="card">
      <div class="qlabel"><span id="qlabel">Rechne aus</span>
        <button class="read-btn" id="speakBtn" aria-label="Vorlesen">🔊</button></div>
      <div id="qzone" class="question">1 + 1</div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </div>
  </div>

  <!-- FERTIG -->
  <div id="done" class="done" hidden>
    <div class="big" id="doneEmoji">🎉</div>
    <h2 id="doneTitle">Super gemacht!</h2>
    <div class="gotstars" id="doneStars">★★★</div>
    <p id="doneText">Du hast 8 von 10 richtig.</p>
    <button class="next" id="againBtn">Nochmal spielen</button>
    <button class="back" id="homeBtn" style="margin-top:.2rem">Zur Startseite</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var ROUNDS = 10;
  var $ = function(s){return document.querySelector(s)};

  /* ---------- Sterne speichern (pro Browser) ---------- */
  var store = {
    get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };
  var totalStars = parseInt(store.get("ls_stars","0"),10)||0;
  var best = {
    math:parseInt(store.get("ls_best_math","0"),10)||0,
    read:parseInt(store.get("ls_best_read","0"),10)||0,
    shape:parseInt(store.get("ls_best_shape","0"),10)||0,
    clock:parseInt(store.get("ls_best_clock","0"),10)||0
  };
  function renderStars(){ $("#starCount").textContent = totalStars;
    ["math","read","shape","clock"].forEach(function(g){ $("#best-"+g).textContent = "★ "+best[g]; }); }

  /* ---------- Vorlesen (Sprachausgabe) ---------- */
  function speak(text){
    try{
      if(!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "de-DE"; u.rate = .9; u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------- Hilfen ---------- */
  function rnd(n){return Math.floor(Math.random()*n)}
  function pick(a){return a[rnd(a.length)]}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t}return a}
  function uniqOptions(correct,make,count){
    var set=[correct],guard=0;
    while(set.length<count && guard++<200){var v=make();if(set.indexOf(v)===-1)set.push(v)}
    return shuffle(set);
  }

  /* ---------- Aufgaben-Generatoren ----------
     Jede liefert: {label, speak, render(zone), options:[...], correct, three?} */

  /* ---------- MATHE: forschungsbasiert für Kinder, die sich schwertun ----------
     Grundlage: explizite Förderung nach dem C-R-A-Prinzip (erst sehen, dann rechnen),
     Subitizing (Mengen auf einen Blick), Zehnerfeld und Zahlzerlegung – kleine Zahlen,
     viel Anschauung, kein Zeitdruck. (vgl. IES Practice Guide, Clements & Sarama,
     Van de Walle, National Math Advisory Panel.) */
  var MCOL = {a:"#ff6b6b", b:"#4e9bff", one:"#ff8a3d"};
  function dotsSVG(n,color,per){
    per=per||5; var gap=22,rad=8,pad=8;
    var cols=Math.min(n,per)||1, rows=Math.max(1,Math.ceil(n/per));
    var w=cols*gap+pad*2, h=rows*gap+pad*2, s="";
    for(var i=0;i<n;i++){var r=Math.floor(i/per),c=i%per;
      s+='<circle cx="'+(pad+rad+c*gap)+'" cy="'+(pad+rad+r*gap)+'" r="'+rad+'" fill="'+color+'"/>';}
    return '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true" style="height:auto;max-height:6rem;max-width:42vw;width:auto;vertical-align:middle">'+s+'</svg>';
  }
  function tenFrameSVG(n,color,crossToTen){
    var gap=30,rad=11,pad=6,per=5;
    var w=per*gap+pad*2, h=2*gap+pad*2, s="";
    for(var i=0;i<10;i++){var r=Math.floor(i/per),c=i%per,x=pad+c*gap,y=pad+r*gap;
      s+='<rect x="'+x+'" y="'+y+'" width="'+gap+'" height="'+gap+'" fill="none" stroke="#d9c7b2" stroke-width="2"/>';
      if(i<n) s+='<circle cx="'+(x+gap/2)+'" cy="'+(y+gap/2)+'" r="'+rad+'" fill="'+color+'"/>';
      else if(crossToTen) s+='<circle cx="'+(x+gap/2)+'" cy="'+(y+gap/2)+'" r="'+rad+'" fill="none" stroke="#cbb89f" stroke-width="2" stroke-dasharray="3 3"/>';}
    return '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true" style="width:min(17rem,80vw);height:auto">'+s+'</svg>';
  }
  function numOpts(correct){ return uniqOptions(correct,function(){var d=correct+(rnd(5)-2);return d<0?correct+1+rnd(3):d},3).map(String); }

  function m_subitize(){
    var n=1+rnd(6);
    return { label:"Wie viele Punkte siehst du?", speak:"Wie viele Punkte siehst du?",
      render:function(z){z.className="question";z.innerHTML='<div style="padding:.5rem 0">'+dotsSVG(n,MCOL.one,3)+'</div>';},
      options:numOpts(n), correct:String(n), three:true };
  }
  function m_tenframe(){
    var n=1+rnd(10);
    return { label:"Wie viele Punkte sind im Zehnerfeld?", speak:"Wie viele Punkte sind im Zehnerfeld?",
      render:function(z){z.className="question";z.innerHTML=tenFrameSVG(n,MCOL.a,false);},
      options:numOpts(n), correct:String(n), three:true };
  }
  function m_bondTen(){
    var n=1+rnd(9), miss=10-n;
    return { label:"Wie viele Punkte fehlen bis 10?", speak:"Wie viele Punkte fehlen noch bis zehn?",
      render:function(z){z.className="question";z.innerHTML=tenFrameSVG(n,MCOL.b,true);},
      options:numOpts(miss), correct:String(miss), three:true };
  }
  function m_add(){
    var a=1+rnd(8), b=1+rnd(9-a>0?9-a:1), res=a+b;
    return { label:"Zähle alle Punkte zusammen", speak:"Wie viel ist "+a+" plus "+b+"?",
      render:function(z){z.className="question";
        z.innerHTML='<div style="display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap;font-family:\'Baloo 2\',sans-serif">'
          +dotsSVG(a,MCOL.a)+'<span style="font-size:2.2rem">+</span>'+dotsSVG(b,MCOL.b)
          +'<span style="font-size:2.2rem">=&nbsp;?</span></div>'
          +'<div style="font-size:1.4rem;margin-top:.4rem">'+a+" + "+b+" = ?</div>";},
      options:numOpts(res), correct:String(res), three:true };
  }
  function m_sub(){
    var t=3+rnd(7), k=1+rnd(t-1), res=t-k;
    return { label:"Die hellen Punkte sind weg. Wie viele bleiben?", speak:"Wie viel ist "+t+" minus "+k+"?",
      render:function(z){z.className="question";
        var gap=24,rad=9,pad=8,per=5,cols=Math.min(t,per),rows=Math.ceil(t/per);
        var w=cols*gap+pad*2,h=rows*gap+pad*2,s="";
        for(var i=0;i<t;i++){var r=Math.floor(i/per),c=i%per,x=pad+rad+c*gap,y=pad+rad+r*gap;
          var gone=i>=t-k;
          s+='<circle cx="'+x+'" cy="'+y+'" r="'+rad+'" fill="'+(gone?"#e9ddcb":MCOL.one)+'"/>';
          if(gone)s+='<line x1="'+(x-rad)+'" y1="'+(y-rad)+'" x2="'+(x+rad)+'" y2="'+(y+rad)+'" stroke="#c0392b" stroke-width="2.5"/>';}
        z.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true" style="height:auto;max-height:7rem;width:auto;max-width:80vw"><g>'+s+'</g></svg>'
          +'<div style="font-size:1.4rem;margin-top:.4rem;font-family:\'Baloo 2\',sans-serif">'+t+" − "+k+" = ?</div>";},
      options:numOpts(res), correct:String(res), three:true };
  }
  var MATH_SET=[m_subitize,m_tenframe,m_bondTen,m_add,m_add,m_sub]; // Plus etwas häufiger
  function genMath(){ return pick(MATH_SET)(); }

  var WORDS = [
    {w:"Apfel",e:"🍎"},{w:"Ball",e:"⚽"},{w:"Baum",e:"🌳"},{w:"Blume",e:"🌸"},
    {w:"Hund",e:"🐶"},{w:"Katze",e:"🐱"},{w:"Maus",e:"🐭"},{w:"Fisch",e:"🐟"},
    {w:"Sonne",e:"☀️"},{w:"Stern",e:"⭐"},{w:"Haus",e:"🏠"},{w:"Auto",e:"🚗"},
    {w:"Banane",e:"🍌"},{w:"Ente",e:"🦆"},{w:"Igel",e:"🦔"},{w:"Uhr",e:"⏰"},
    {w:"Elefant",e:"🐘"},{w:"Nase",e:"👃"},{w:"Tasse",e:"🍵"},{w:"Robbe",e:"🦭"}
  ];
  function genRead(){
    var mode = Math.random()<0.5 ? "anlaut" : "wort";
    if(mode==="anlaut"){
      var item=pick(WORDS); var letter=item.w.charAt(0).toUpperCase();
      var opts=uniqOptions(letter,function(){return pick("BHKMSATELINOFRUPDGZ".split(""))},3);
      return {
        label:"Mit welchem Buchstaben beginnt das Wort?",
        speak:"Mit welchem Buchstaben beginnt "+item.w+"?",
        render:function(z){z.className="question";z.innerHTML='<span class="em">'+item.e+'</span>'+item.w;},
        options:opts, correct:letter, three:true
      };
    } else {
      var right=pick(WORDS);
      var others=shuffle(WORDS.filter(function(x){return x.w!==right.w})).slice(0,2);
      var opts=shuffle([right].concat(others));
      return {
        label:"Welches Wort passt zum Bild?",
        speak:"Welches Wort passt zum Bild?",
        render:function(z){z.className="question";z.innerHTML='<span class="em">'+right.e+'</span>';},
        options:opts.map(function(o){return o.w}), correct:right.w, word:true, three:true
      };
    }
  }

  var SHAPES = {
    Kreis:'<circle cx="60" cy="60" r="46"/>',
    Quadrat:'<rect x="16" y="16" width="88" height="88" rx="6"/>',
    Dreieck:'<polygon points="60,14 108,104 12,104"/>',
    Rechteck:'<rect x="10" y="30" width="100" height="60" rx="6"/>',
    Stern:'<polygon points="60,10 73,46 112,46 80,70 92,108 60,84 28,108 40,70 8,46 47,46"/>',
    Herz:'<path d="M60 104 L22 64 a22 22 0 0 1 38 -22 a22 22 0 0 1 38 22 Z"/>'
  };
  var COLORS = [
    {n:"Rot",c:"#ff5b5b"},{n:"Blau",c:"#4e9bff"},{n:"Grün",c:"#36b37e"},
    {n:"Gelb",c:"#ffc53d"},{n:"Lila",c:"#b07bff"},{n:"Orange",c:"#ff8a3d"}
  ];
  function svgShape(path,color){
    return '<svg class="art" viewBox="0 0 120 120" aria-hidden="true"><g fill="'+color+'">'+path+'</g></svg>';
  }
  function genShape(){
    var askColor = Math.random()<0.5;
    var names=Object.keys(SHAPES);
    var shape=pick(names); var col=pick(COLORS);
    if(askColor){
      var opts=uniqOptions(col.n,function(){return pick(COLORS).n},3);
      return {
        label:"Welche Farbe hat die Form?",
        speak:"Welche Farbe hat die Form?",
        render:function(z){z.className="question";z.innerHTML=svgShape(SHAPES[shape],col.c);},
        options:opts, correct:col.n, three:true
      };
    } else {
      var opts2=uniqOptions(shape,function(){return pick(names)},3);
      return {
        label:"Wie heißt diese Form?",
        speak:"Wie heißt diese Form?",
        render:function(z){z.className="question";z.innerHTML=svgShape(SHAPES[shape],col.c);},
        options:opts2, correct:shape, word:true, three:true
      };
    }
  }

  function clockSVG(h,m){
    var cx=60,cy=60;
    function hand(len,ang,w,col){
      var r=(ang-90)*Math.PI/180;
      return '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+len*Math.cos(r)).toFixed(1)+'" y2="'+(cy+len*Math.sin(r)).toFixed(1)+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round"/>';
    }
    var ticks="";
    for(var i=0;i<12;i++){var a=i*30*Math.PI/180;
      ticks+='<circle cx="'+(cx+46*Math.sin(a)).toFixed(1)+'" cy="'+(cy-46*Math.cos(a)).toFixed(1)+'" r="2.4" fill="#b8a897"/>';}
    var nums="";
    [[12,0],[3,90],[6,180],[9,270]].forEach(function(p){
      var a=p[1]*Math.PI/180;
      nums+='<text x="'+(cx+37*Math.sin(a)).toFixed(1)+'" y="'+(cy-37*Math.cos(a)+5).toFixed(1)+'" font-size="13" font-family="Baloo 2,sans-serif" font-weight="800" fill="#6b5a4c" text-anchor="middle">'+p[0]+'</text>';
    });
    var minAng=m*6, hourAng=(h%12)*30 + m*0.5;
    return '<svg class="art" viewBox="0 0 120 120" aria-hidden="true">'+
      '<circle cx="60" cy="60" r="55" fill="#fff" stroke="#e4d6c4" stroke-width="4"/>'+
      ticks+nums+
      hand(26,hourAng,5,"#b07bff")+hand(38,minAng,3.5,"#ff8a3d")+
      '<circle cx="60" cy="60" r="4" fill="#3a2f28"/></svg>';
  }
  function timeWords(h,m){
    var hh=((h+11)%12)+1;
    if(m===0) return hh+" Uhr";
    if(m===30) return "halb "+(hh%12+1); // halb -> nächste Stunde
    return hh+" Uhr "+m;
  }
  function genClock(){
    var h=1+rnd(12);
    var m=pick([0,0,30]); // volle und halbe Stunden
    var correct=timeWords(h,m);
    var opts=uniqOptions(correct,function(){
      var h2=1+rnd(12),m2=pick([0,30]);return timeWords(h2,m2);
    },3);
    return {
      label:"Wie spät ist es?",
      speak:"Wie spät ist es?",
      render:function(z){z.className="question";z.innerHTML=clockSVG(h,m);},
      options:opts, correct:correct, word:true, three:true
    };
  }

  var GAMES = {
    math:{gen:genMath,title:"Rechnen"},
    read:{gen:genRead,title:"Lesen"},
    shape:{gen:genShape,title:"Formen & Farben"},
    clock:{gen:genClock,title:"Die Uhr"}
  };

  var PRAISE=["Super!","Toll!","Richtig!","Klasse!","Bravo!","Stark!","Perfekt!","Juhu!"];
  var TRY=["Fast! Versuch es nochmal.","Nicht ganz – probier noch mal!","Schau nochmal genau hin."];

  /* ---------- Spielzustand ---------- */
  var state=null;

  function startGame(key){
    state={key:key, round:0, correct:0, current:null, tries:0, earned:0};
    $("#home").hidden=true; $("#done").hidden=true; $("#play").hidden=false;
    nextRound();
  }

  function nextRound(){
    if(state.round>=ROUNDS){ return finish(); }
    state.round++; state.tries=0;
    state.current = GAMES[state.key].gen();
    var q=state.current;
    $("#qlabel").textContent=q.label;
    $("#roundLbl").textContent=state.round+"/"+ROUNDS;
    $("#progBar").style.width=((state.round-1)/ROUNDS*100)+"%";
    q.render($("#qzone"));
    $("#feedback").textContent=""; $("#feedback").className="feedback";
    buildAnswers(q);
  }

  function buildAnswers(q){
    var box=$("#answers");
    box.innerHTML="";
    box.className="answers"+(q.three?" three":"");
    q.options.forEach(function(opt){
      var b=document.createElement("button");
      b.className="opt";
      if(q.word){ b.innerHTML='<span class="word">'+opt+'</span>'; }
      else { b.textContent=opt; }
      b.setAttribute("aria-label",opt);
      b.addEventListener("click",function(){ choose(b,opt,q); });
      box.appendChild(b);
    });
  }

  function flyStar(x,y){
    var s=document.createElement("div");
    s.className="flystar";s.textContent="★";
    s.style.left=(x-16)+"px";s.style.top=(y-16)+"px";
    document.body.appendChild(s);
    setTimeout(function(){s.remove();},1000);
  }

  function choose(btn,opt,q){
    if(btn.disabled) return;
    if(opt===q.correct){
      btn.classList.add("good");
      Array.prototype.forEach.call($("#answers").children,function(c){c.disabled=true;});
      var fb=$("#feedback"); fb.className="feedback ok"; fb.innerHTML="⭐ "+pick(PRAISE);
      var gain = state.tries===0 ? 1 : 0;   // beim ersten Versuch gibt es einen Stern
      if(gain){ totalStars++; state.earned++; store.set("ls_stars",totalStars); renderStars();
        var r=btn.getBoundingClientRect(); flyStar(r.left+r.width/2, r.top); }
      state.correct++;
      speak(pick(PRAISE));
      $("#progBar").style.width=(state.round/ROUNDS*100)+"%";
      setTimeout(nextRound, 950);
    } else {
      state.tries++;
      btn.classList.add("bad"); btn.disabled=true;
      var f=$("#feedback"); f.className="feedback try"; f.textContent=pick(TRY);
      // nach zwei Fehlversuchen die richtige Lösung zeigen
      if(state.tries>=2){
        Array.prototype.forEach.call($("#answers").children,function(c){
          c.disabled=true;
          var val=c.getAttribute("aria-label");
          if(val===q.correct) c.classList.add("good");
        });
        f.innerHTML="Die Lösung ist <b>"+q.correct+"</b>";
        setTimeout(nextRound, 1600);
      }
    }
  }

  function finish(){
    $("#play").hidden=true; $("#done").hidden=false;
    $("#progBar").style.width="100%";
    var got=state.correct, total=ROUNDS;
    if(state.earned>best[state.key]){ best[state.key]=state.earned; store.set("ls_best_"+state.key,state.earned); renderStars(); }
    var medals = got>=9?"★★★":got>=6?"★★":got>=1?"★":"";
    $("#doneStars").textContent=medals||"☆";
    $("#doneEmoji").textContent = got>=9?"🏆":got>=6?"🎉":"🌟";
    $("#doneTitle").textContent = got>=9?"Fantastisch!":got>=6?"Super gemacht!":"Gut geübt!";
    $("#doneText").textContent = "Du hast "+got+" von "+total+" richtig und "+state.earned+" Sterne verdient.";
    speak($("#doneTitle").textContent);
  }

  /* ---------- Steuerung ---------- */
  Array.prototype.forEach.call(document.querySelectorAll(".tile"),function(t){
    t.addEventListener("click",function(){ startGame(t.getAttribute("data-game")); });
  });
  $("#backBtn").addEventListener("click",goHome);
  $("#homeBtn").addEventListener("click",goHome);
  $("#againBtn").addEventListener("click",function(){ startGame(state.key); });
  $("#speakBtn").addEventListener("click",function(){ if(state&&state.current) speak(state.current.speak); });
  function goHome(){
    try{window.speechSynthesis.cancel();}catch(e){}
    $("#play").hidden=true; $("#done").hidden=true; $("#home").hidden=false;
  }

  /* Thema hell/dunkel */
  var themeBtn=$("#themeBtn");
  function applyTheme(t){
    if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");themeBtn.textContent="☀️";}
    else if(t==="light"){document.documentElement.setAttribute("data-theme","light");themeBtn.textContent="🌙";}
    else {document.documentElement.removeAttribute("data-theme");
      themeBtn.textContent = matchMedia("(prefers-color-scheme: dark)").matches?"☀️":"🌙";}
  }
  var savedTheme=store.get("ls_theme","system");
  applyTheme(savedTheme);
  themeBtn.addEventListener("click",function(){
    var cur=store.get("ls_theme","system");
    var next=cur==="dark"?"light":"dark";
    store.set("ls_theme",next); applyTheme(next);
  });

  renderStars();
})();
</script>
</html>
